title: "Matto Leeuwis"
author: "Matto Leeuwis"
description: "Personal website"
baseurl: "" 
url: "https://mleeuwis.github.io"
theme: minima

minima:
  date_format: "%Y-%m-%d"
  social_links:
    github: mleeuwis
    linkedin: matto-leeuwis

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from

# Navigation: list the pages that should appear in the header
header_pages:
  - news.md
  - projects.md
  - blog.md
  - cv.md
  - publications.md

# Collections for News and Projects
collections:
  news:
    output: true
    permalink: /news/:name/
  projects:
    output: true
    permalink: /projects/:name/

# Markdown and permalink style
markdown: kramdown
permalink: /blog/:year/:month/:day/:title/